<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Um Convite Especial</title>

    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: #f5f5f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: #333;
        }

        .container {
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            width: 100%;
            max-width: 450px;
            text-align: center;
            position: relative;
        }

        .screen {
            display: none;
            animation: fadeIn 0.5s ease;
        }

        .screen.active {
            display: block;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        h1 {
            font-size: 24px;
            margin-bottom: 10px;
            color: #1a1a1a;
        }

        p {
            font-size: 14px;
            color: #666;
            margin-bottom: 30px;
            line-height: 1.5;
        }

        .subtitle {
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #888;
            margin-bottom: 20px;
            display: block;
        }

        /* Área da lua */
        .cat-img {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            margin: 0 auto 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f5f5f5;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        /* Lua cheia */
        .moon {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            position: relative;

            background:
                radial-gradient(
                    circle at 30% 32%,
                    rgba(170,170,170,0.30) 0 4px,
                    transparent 5px
                ),
                radial-gradient(
                    circle at 67% 25%,
                    rgba(160,160,160,0.22) 0 6px,
                    transparent 7px
                ),
                radial-gradient(
                    circle at 63% 63%,
                    rgba(170,170,170,0.28) 0 8px,
                    transparent 9px
                ),
                radial-gradient(
                    circle at 27% 70%,
                    rgba(160,160,160,0.20) 0 5px,
                    transparent 6px
                ),
                radial-gradient(
                    circle at 48% 48%,
                    rgba(180,180,180,0.18) 0 3px,
                    transparent 4px
                ),
                linear-gradient(
                    135deg,
                    #ffffff,
                    #e8e8e4
                );

            box-shadow:
                inset -8px -6px 12px rgba(120,120,120,0.12),
                0 0 8px rgba(255,255,255,1),
                0 0 20px rgba(190,205,230,0.55),
                0 0 35px rgba(190,205,230,0.25);
        }

        .moon::before {
            content: "";
            position: absolute;
            width: 9px;
            height: 9px;
            border-radius: 50%;
            background: rgba(160,160,160,0.18);
            left: 17px;
            top: 35px;

            box-shadow:
                26px -18px 0 2px rgba(170,170,170,0.15),
                33px 11px 0 1px rgba(160,160,160,0.18),
                11px 21px 0 -1px rgba(150,150,150,0.18);
        }

        /* Botões */
        .btn-group {
            display: flex;
            justify-content: center;
            gap: 15px;
            position: relative;
        }

        button {
            padding: 12px 24px;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-yes {
            background-color: #d81b60;
            color: white;
        }

        .btn-yes:hover {
            background-color: #ad144b;
        }

        .btn-no {
            background-color: #f0f0f0;
            color: #666;
            position: relative;
        }

        .btn-primary {
            background-color: #d81b60;
            color: white;
            width: 100%;
            margin-top: 20px;
        }

        .food-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 20px;
        }

        .food-item {
            background: #fafafa;
            border: 1px solid #ddd;
            padding: 15px 5px;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 12px;
            font-weight: 600;
        }

        .food-item:hover {
            border-color: #d81b60;
        }

        .food-item.selected {
            border-color: #d81b60;
            background-color: #fff0f5;
            color: #d81b60;
        }

        .food-item span {
            display: block;
            font-size: 24px;
            margin-bottom: 5px;
        }
    </style>
</head>

<body>

    <div class="container">

        <!-- TELA 1 -->
        <div id="screen1" class="screen active">

            <span class="subtitle">Um Convite</span>

            <div class="cat-img">
                <div class="moon"></div>
            </div>

            <h1>Você aceita sair comigo?</h1>

            <p>
                Sem pressão. Sério. Só uma noite, uma boa conversa
                e a chance de eu te fazer rir pelo menos três vezes.
            </p>

            <div class="btn-group">

                <button
                    class="btn-yes"
                    onclick="nextScreen('screen2'); triggerConfetti();"
                >
                    Bora
                </button>

                <button
                    class="btn-no"
                    id="btn-no"
                >
                    Não
                </button>

            </div>

        </div>

        <!-- TELA 2 -->
        <div id="screen2" class="screen">

            <h1>😳 Opa, nunca cheguei nessa parte...</h1>

            <p>
                Bom, agora deixa comigo 😏
            </p>

        </div>

    </div>

    <script>

        const btnNo = document.getElementById('btn-no');

        function escapar() {

            btnNo.style.position = 'fixed';

            const w = btnNo.offsetWidth;
            const h = btnNo.offsetHeight;

            const maxX = Math.max(
                0,
                window.innerWidth - w - 10
            );

            const maxY = Math.max(
                0,
                window.innerHeight - h - 10
            );

            const randomX =
                Math.floor(Math.random() * maxX) + 5;

            const randomY =
                Math.floor(Math.random() * maxY) + 5;

            btnNo.style.left = randomX + 'px';
            btnNo.style.top = randomY + 'px';
        }

        /* PC */
        btnNo.addEventListener(
            'mouseenter',
            escapar
        );

        /* Celular */
        btnNo.addEventListener(
            'pointerdown',
            function(e) {

                if (e.pointerType !== 'mouse') {

                    e.preventDefault();
                    escapar();
                }
            }
        );

        /* Impede clicar no Não */
        btnNo.addEventListener(
            'click',
            function(e) {

                e.preventDefault();
                escapar();
            }
        );

        function nextScreen(screenId) {

            document
                .querySelectorAll('.screen')
                .forEach(
                    s => s.classList.remove('active')
                );

            document
                .getElementById(screenId)
                .classList.add('active');
        }

        function triggerConfetti() {

            confetti({
                particleCount: 150,
                spread: 70,
                origin: {
                    y: 0.6
                },
                colors: [
                    '#d81b60',
                    '#ffc107',
                    '#00bcd4'
                ]
            });
        }

    </script>

</body>
</html>
